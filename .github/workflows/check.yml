permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
# Toolchains, runner images and tools are pinned, not only the actions: a floating `stable` picks up
# new lints on its release day and fails the build without any change in the repository. Bump them
# deliberately, together with `devenv.nix`.
env:
  STABLE: "1.93.1"
  BETA: "beta-2026-10-05"
  NIGHTLY: "nightly-2026-10-04"
jobs:
  fmt:
    runs-on: ubuntu-24.04
    name: nightly / fmt
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install nightly
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-24.04
    name: ${{ matrix.toolchain }} / clippy
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # Get early warning of new lints which are regularly introduced in beta channels. Pinned like
        # stable, so the warning comes with bumping it rather than on a random day.
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,x86_64-unknown-linux-gnu
          toolchain: ${{ matrix.toolchain == 'stable' && env.STABLE || env.BETA }}
          components: clippy
      - name: cargo clippy (esp-nvs)
        run: cargo clippy --release --package esp-nvs --features=defmt -- --deny warnings
      - name: cargo clippy (esp-nvs-partition-tool)
        run: cargo clippy --release --package esp-nvs-partition-tool -- --deny warnings
  check:
    runs-on: ubuntu-24.04
    name: stable / check
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          toolchain: ${{ env.STABLE }}
      - name: cargo check
        run: cargo check --workspace --all-targets
  build-32-bit:
    # Overflow in constant arithmetic (`arithmetic_overflow`) is only reported by a real build, not by
    # check or clippy, and a dependent crate never sees it because cargo caps lints of dependencies.
    # The tests run on 64-bit hosts, so build for the 32-bit targets the crate is used on.
    runs-on: ubuntu-24.04
    name: stable / build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [riscv32imc-unknown-none-elf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          toolchain: ${{ env.STABLE }}
          target: ${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --package esp-nvs --target ${{ matrix.target }}
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    runs-on: ubuntu-24.04
    name: nightly / doc
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install nightly
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: Install cargo-docs-rs
        # dtolnay/install fetches whatever binary its rolling release holds, so build a fixed version
        run: cargo install cargo-docs-rs --version 1.0.4 --locked
      - name: cargo docs-rs (esp-nvs)
        run: cargo docs-rs --package esp-nvs
      - name: cargo docs-rs (esp-nvs-partition-tool)
        run: cargo docs-rs --package esp-nvs-partition-tool
  msrv:
    runs-on: ubuntu-24.04
    # we use a matrix here just because env can't be used in job names
    # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    strategy:
      matrix:
        # 2024 edition msrv is 1.85.0 but esp-hal requires 1.88.0
        msrv: ["1.88.0"]
    name: ubuntu / ${{ matrix.msrv }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # tag=v6.0.0
        with:
          submodules: true
      - name: Install ${{ matrix.msrv }}
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # branch=master
        with:
          toolchain: ${{ matrix.msrv }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # tag=v4.3.0
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo
      - name: cargo +${{ matrix.msrv }} check
        run: cargo check --workspace
